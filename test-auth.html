<!DOCTYPE html>
<html>
<head>
    <title>Halo Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>Halo Authentication Test</h1>

    <div>
        <h2>Test 1: Health Check</h2>
        <button onclick="testHealth()">Test /health</button>
        <div id="health-result" class="result"></div>
    </div>

    <div>
        <h2>Test 2: Auth Config</h2>
        <button onclick="testAuthConfig()">Test /api/v1/auth/config</button>
        <div id="auth-config-result" class="result"></div>
    </div>

    <div>
        <h2>Test 3: Get Current User (should fail without auth)</h2>
        <button onclick="testCurrentUser()">Test /api/v1/auth/me</button>
        <div id="current-user-result" class="result"></div>
    </div>

    <div>
        <h2>Test 4: Fetch Models (should work without auth)</h2>
        <button onclick="testFetchModels()">Test /api/v1/ai-sources/fetch-models</button>
        <div id="fetch-models-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5173';

        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const result = document.getElementById('health-result');
                result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.className = 'result success';
            } catch (error) {
                const result = document.getElementById('health-result');
                result.innerHTML = `Error: ${error.message}`;
                result.className = 'result error';
            }
        }

        async function testAuthConfig() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/config`);
                const data = await response.json();
                const result = document.getElementById('auth-config-result');
                result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.className = data.success ? 'result success' : 'result error';
            } catch (error) {
                const result = document.getElementById('auth-config-result');
                result.innerHTML = `Error: ${error.message}`;
                result.className = 'result error';
            }
        }

        async function testCurrentUser() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/me`);
                const data = await response.json();
                const result = document.getElementById('current-user-result');
                result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.className = data.success ? 'result success' : 'result error';
            } catch (error) {
                const result = document.getElementById('current-user-result');
                result.innerHTML = `Error: ${error.message}`;
                result.className = 'result error';
            }
        }

        async function testFetchModels() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/ai-sources/fetch-models`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        apiKey: 'test-key',
                        apiUrl: 'https://api.openai.com'
                    })
                });
                const data = await response.json();
                const result = document.getElementById('fetch-models-result');
                result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.className = data.success ? 'result success' : 'result error';
            } catch (error) {
                const result = document.getElementById('fetch-models-result');
                result.innerHTML = `Error: ${error.message}`;
                result.className = 'result error';
            }
        }
    </script>
</body>
</html>
