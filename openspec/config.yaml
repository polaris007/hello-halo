schema: spec-driven

# Project context - shown to AI when creating artifacts
context: |
  ## 项目概述
  Halo 是一个 AI 编程助手应用，提供 Claude Agent SDK 集成、空间管理、对话功能、MCP 支持等核心能力。

  ## 技术栈
  - 前端：React 18 + TypeScript + Vite + Tailwind CSS + Zustand
  - 后端：Node.js + Express 5 + SSE (Server-Sent Events)
  - 数据库：SQLite (better-sqlite3)
  - AI：@anthropic-ai/claude-agent-sdk
  - 构建工具：electron-vite（当前）、Vite（改造后）

  ## 项目结构
  - src/main/ - Electron 主进程 / 服务端代码
  - src/renderer/ - React 前端代码
  - src/preload/ - Electron preload 脚本（将被移除）
  - src/shared/ - 共享类型定义
  - src/worker/ - Worker 线程

  ## 代码规范
  - 语言：TypeScript (ESM)
  - UI 组件使用 t('English text') 进行国际化，无需手动编写翻译文件
  - 提交前运行 npm run i18n 自动提取和翻译

  ## 数据存储
  - 应用数据目录：{cwd}/data/（可通过 HALO_DATA_DIR 或 --data-dir 配置）
  - 数据库文件：{data-dir}/hello.db
  - 空间目录：{data-dir}/users/{user_id}/spaces/
  - 日志目录：{data-dir}/logs/（可通过 HALO_LOG_DIR 覆盖）

  ## API 设计
  - HTTP API 前缀：/api/v1/
  - 已有双传输层：IPC (本地) + HTTP (远程)
  - SSE 流式响应用于 AI 消息实时推送

  ## 核心约束
  - **必须基于 Claude Agent SDK（@anthropic-ai/claude-agent-sdk）实现**：所有 AI 交互功能必须通过 Claude Agent SDK 驱动。SDK 运行于纯 Node.js 环境（>= 18），通过 child_process.spawn() 启动内置 cli.js 子进程，不依赖 Electron 或其他特殊运行时。
  - **必须支持 Docker 镜像部署**：应用将来会打包到 Linux Docker 镜像中，作为一个服务部署。代码实现必须考虑：
    - 文件路径使用跨平台兼容方式（使用 path 模块，避免硬编码 Windows 路径）
    - 不依赖图形界面或桌面环境
    - 支持环境变量配置（如端口、数据目录、密钥等）
    - 支持容器化场景下的日志输出（stdout/stderr）
    - 考虑容器重启后的数据持久化（数据目录应支持挂载卷）

  ## 当前架构变更
  项目正在从 Electron 桌面应用改造为 B/S 架构的 Web 应用。
  主要变更：
  - 移除 Electron 依赖
  - 新增用户认证（支持系统对接场景）
  - 新增多租户数据隔离（空间归属用户，按用户隔离）
  - 移除 AI Browser 和产物展示功能
  - 移除第三方 AI 提供商认证（腾讯、千问、Kiro、Github 等）
  - AI 提供商改为配置文件或界面直接配置

# Per-artifact rules
rules:
  proposal:
    - 提案应简洁（1-2 页），聚焦"为什么"而非"怎么做"
    - 清晰标注 **BREAKING** 变更
    - Capabilities 部分必须准确，这将决定后续 spec 文件的结构
  design:
    - 技术设计应包含架构图（使用 ASCII 或 Mermaid）
    - 每个决策需说明理由和替代方案
    - 风险部分需包含缓解措施
  specs:
    - 每个需求必须使用 SHALL/MUST 规范性语言
    - 每个场景必须使用 #### Scenario: 格式（4 个 #）
    - 场景格式：WHEN...THEN...
  tasks:
    - 任务按模块分组，每组编号
    - 任务粒度适中，一个任务可在一次会话中完成
    - 使用 `- [ ] X.Y 描述` 格式便于进度追踪
