version: '3.8'

services:
  hello:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hello-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist data directory
      - hello-data:/data/hello
      # Mount config directory (recommended)
      # Place your server.json and llm-config.json in ./config/ directory
      - ../config:/app/config:ro
      # Alternative: mount individual config files (legacy approach)
      # - ./server.json:/app/config/server.json:ro
      # - ./llm-config.json:/app/config/llm-config.json:ro
    environment:
      - NODE_ENV=production
      - HELLO_DATA_DIR=/data/hello
      - HELLO_CONFIG_DIR=/app/config
      - HELLO_PORT=3000
      - HELLO_HOST=0.0.0.0
      # Authentication configuration
      - HELLO_AUTH_MODE=normal
      # Optional: Set default password for admin user
      # - HELLO_DEFAULT_PASSWORD=your-secure-password
      # Optional: Simple token mode
      # - HELLO_AUTH_MODE=simple
      # - HELLO_AUTH_SIMPLE_TOKEN=your-token-here
      # Optional: Header auth mode
      # - HELLO_AUTH_MODE=header
      # - HELLO_AUTH_HEADER_NAME=X-User-Id
      # AI Provider configuration via environment
      # - HELLO_ANTHROPIC_API_KEY=sk-xxx
      # - HELLO_OPENAI_API_KEY=sk-xxx
    networks:
      - hello-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Add reverse proxy (nginx) for HTTPS
# nginx:
#   image: nginx:alpine
#   ports:
#     - "80:80"
#     - "443:443"
#   volumes:
#     - ./nginx.conf:/etc/nginx/nginx.conf:ro
#     - ./ssl:/etc/nginx/ssl:ro
#   depends_on:
#     - hello
#   networks:
#     - hello-network

volumes:
  hello-data:
    driver: local

networks:
  hello-network:
    driver: bridge
