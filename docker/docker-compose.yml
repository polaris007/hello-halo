version: '3.8'

services:
  halo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: halo-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist data directory
      - halo-data:/data/halo
      # Mount config directory (recommended)
      # Place your server.json and llm-config.json in ./config/ directory
      - ../config:/app/config:ro
      # Alternative: mount individual config files (legacy approach)
      # - ./server.json:/app/config/server.json:ro
      # - ./llm-config.json:/app/config/llm-config.json:ro
    environment:
      - NODE_ENV=production
      - HALO_DATA_DIR=/data/halo
      - HALO_CONFIG_DIR=/app/config
      - HALO_PORT=3000
      - HALO_HOST=0.0.0.0
      # Authentication configuration
      - HALO_AUTH_MODE=normal
      # Optional: Set default password for admin user
      # - HALO_DEFAULT_PASSWORD=your-secure-password
      # Optional: Simple token mode
      # - HALO_AUTH_MODE=simple
      # - HALO_AUTH_SIMPLE_TOKEN=your-token-here
      # Optional: Header auth mode
      # - HALO_AUTH_MODE=header
      # - HALO_AUTH_HEADER_NAME=X-User-Id
      # AI Provider configuration via environment
      # - HALO_AI_ANTHROPIC_API_KEY=sk-xxx
      # - HALO_AI_OPENAI_API_KEY=sk-xxx
    networks:
      - halo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Add reverse proxy (nginx) for HTTPS
# nginx:
#   image: nginx:alpine
#   ports:
#     - "80:80"
#     - "443:443"
#   volumes:
#     - ./nginx.conf:/etc/nginx/nginx.conf:ro
#     - ./ssl:/etc/nginx/ssl:ro
#   depends_on:
#     - halo
#   networks:
#     - halo-network

volumes:
  halo-data:
    driver: local

networks:
  halo-network:
    driver: bridge
